name: Build en deploy naar GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pages-instellingen ophalen
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          # Eigen domein (CNAME)? Dan geeft configure-pages origin = https://jouwdomein.nl en base_path leeg.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.SITE_URL && '/' || format('{0}/', steps.pages.outputs.base_path) }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_RESULTAAT: ${{ vars.PUBLIC_ADSENSE_SLOT_RESULTAAT }}
          PUBLIC_ADSENSE_SLOT_MIDDEN: ${{ vars.PUBLIC_ADSENSE_SLOT_MIDDEN }}
          PUBLIC_ADSENSE_SLOT_ONDER: ${{ vars.PUBLIC_ADSENSE_SLOT_ONDER }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.PUBLIC_GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
